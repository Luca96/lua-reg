name: test

on:
  push:
  pull_request:

jobs:
  busted:
    name: busted (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4", "luajit-2.1"]

    steps:
      # lua-reg needs lua-table's luatable module in a sibling checkout (../lua-table),
      # which is where the .busted config looks for it
      - uses: actions/checkout@v5
        with:
          path: lua-reg

      - uses: actions/checkout@v5
        with:
          repository: Luca96/lua-table
          path: lua-table

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: luarocks install busted

      - name: Run the test suite
        working-directory: lua-reg
        run: |
          lua -v
          busted --exclude-tags=knownbug
